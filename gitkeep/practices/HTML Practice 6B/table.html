<!DOCTYPE html>
<html>
<head>

	<meta charset="UTF-8">	
	<title>HTML Practice 6 - Tables</title>
	<style type="text/css">	
		.centerdiv {
			text-align: center;
}
		.center-table { 
			margin: 0 auto;
			width: 550px;
			border-collapse: collapse;
			font-family: Arial, sans-serif;
}
	th { 
		background-color: #f2f2f2;
		
	/* New CSS class for the days of the week table headings */ 
	.day-heading {
		background-color: #99FF66;
	}
}
	/* New class created for the caption */
	.table-caption { 
		color: #003300;
		font-weight: bold; 
		font-size: 1.2em;
		padding-bottom: 8px;
	}
	
	/* Style for the first column colgroup */
	.first-col {
		background-color: #CCCCCC;
		width: 25%
	}
	
	</style>
</head>
<body>
	<div class="center-div">
		<table class="center-table" border="1" cellspacing="0" cellpadding="5">
			<caption class="table-caption">My Class Schedule</caption>
			<colgroup class="first-col"></colgroup>
			<colgroup class="days" span="5"></colgroup>
			<thead>
				<tr>
					<th>Type/Time</th>
					<th class="day-heading">Monday</th>
					<th class="day-heading">Tuesday</th>
					<th class="day-heading">Wednesday</th>
					<th class="day-heading">Thursday</th>
					<th class="day-heading">Friday</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td><strong>Online Course</strong></td>
					<td colspan="5" style="text-align: center;">INFO 2420 - Web Development</td>
				</tr>
				
				<tr>
					<td><strong>Online Course</strong></td>
					<td colspan="5" style="text-align: center">IM 2600 - Spreadsheets</td>
				</tr>
			</tbody>
		</table>
	</div>
</body>
</html>
